; ================================================================
; CurSeen 击键回显 · 键名映射表
;
; 改这个文件就能改每个键位在弹窗里显示的文字：
; 保存后按一次键立即生效，不需要重启程序。
;
; 规则
;   1. 每行：  键名 = 显示文字
;   2. 键名是下面列出的固定 ID（区分大小写）。主键盘与小键盘的重名键
;      用 Num 前缀（小键盘）和 Oem 前缀（符号键）区分，例如 Num0 是
;      小键盘 0、OemMinus 是主键盘减号；
;   3. 行首分号(;)或井号(#)是注释；[节] 会被忽略；
;   4. 值留空 = 这一条恢复内置默认；删掉整个文件 = 全部恢复默认；
;   5. 改名后若文字不再是内置功能键名（如 F1、Esc），该键将按普通键
;      颜色（默认黄）绘制，不再用功能键色（默认红）；
;   6. 修饰键（Shift/Ctrl/Alt/Win/Menu）改名只影响前缀显示
;      （例如 Ctrl = Ctrl 改成 Ctrl = Ctrl键 后，弹窗显示 "Ctrl键 + C"）。
; ================================================================

